<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AOS | Absensi Online Siswa</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* ===== RESET ===== */
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Poppins',sans-serif;
    background:
      radial-gradient(circle at top left,#e8f1ff,transparent 45%),
      radial-gradient(circle at bottom right,#dbe9ff,transparent 45%),
      linear-gradient(135deg,#f4f8ff,#e6f0ff);
    color:#1a2b5f;
    min-height:100vh;
}

/* ===== LOADING ===== */
#loadingAOS{
    position:fixed;inset:0;
    background:#fff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
}
.loader-circle{
    width:70px;height:70px;
    border:6px solid #dbe4ff;
    border-top:6px solid #4da3ff;
    border-radius:50%;
    animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== HEADER ===== */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
    backdrop-filter:blur(10px);
    background:rgba(255,255,255,.7);
    box-shadow:0 8px 20px rgba(0,0,0,.05);
}
.evscientist{
    font-size:1.4rem;
    font-weight:900;
    letter-spacing:3px;
    background:linear-gradient(135deg,#9ad9ff,#4da3ff);
    -webkit-background-clip:text;
    color:transparent;
}

/* ===== HAMBURGER ===== */
.hamburger{
    width:34px;height:26px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    cursor:pointer;
}
.hamburger span{
    height:4px;
    background:#4da3ff;
    border-radius:2px;
    transition:.3s;
}
.hamburger.active span:nth-child(1){transform:rotate(45deg) translate(6px,6px)}
.hamburger.active span:nth-child(2){opacity:0}
.hamburger.active span:nth-child(3){transform:rotate(-45deg) translate(6px,-6px)}

/* ===== SIDEBAR ===== */
.sidebar{
    position:fixed;
    right:-260px;top:0;
    width:260px;height:100%;
    background:#4da3ff;
    padding:80px 25px;
    transition:.3s;
    z-index:1000;
}
.sidebar.active{right:0}
.sidebar a{
    display:block;
    color:#fff;
    text-decoration:none;
    margin-bottom:18px;
    font-size:1.05rem;
}

/* ===== OVERLAY ===== */
.overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.35);
    opacity:0;visibility:hidden;
    transition:.3s;
}
.overlay.active{opacity:1;visibility:visible}

/* ===== SECTION ===== */
.section{display:none;padding:40px 20px}
.section.active{display:block}

/* ===== CARD ===== */
.card{
    max-width:900px;
    margin:auto;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(14px);
    border-radius:20px;
    padding:40px;
    box-shadow:0 20px 40px rgba(0,0,0,.08);
}

/* ===== BUTTON ===== */
button{
    background:#4da3ff;
    color:#fff;
    border:none;
    padding:14px 32px;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
}

/* ===== LOGO ===== */
.logo-center{
    display:block;
    margin:20px auto 25px;
    width:90px;
    opacity:.95;
}

/* ===== TABLE ===== */
table{width:100%;border-collapse:collapse}
th{
    background:#4da3ff;
    color:#fff;
    padding:12px;
}
td{
    padding:10px;
    text-align:center;
}
tr:nth-child(even){background:#f2f7ff}

/* ===== MODAL ===== */
.modal{
    position:fixed;inset:0;
    background:rgba(0,0,0,.4);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:2000;
}
.modal.active{display:flex}
.modal-box{
    background:#fff;
    padding:30px;
    border-radius:16px;
    width:320px;
}
</style>
</head>

<body>

<div id="loadingAOS">
    <div class="loader-circle"></div>
</div>

<header>
    <div class="evscientist">EVSCIENTIST FIVE</div>
    <div class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
    </div>
</header>

<div class="sidebar" id="sidebar">
    <a href="#" data-section="home">🏠 Home</a>
    <a href="#" data-section="dashboard">📊 Dashboard</a>
    <a href="#" data-section="siswa">👥 Data Siswa</a>
</div>
<div class="overlay" id="overlay"></div>

<!-- HOME -->
<section class="section active" id="home">
    <div class="card" style="text-align:center">
        <h1>AOS — Absensi Online Siswa</h1>

        <!-- LOGO TENGAH -->
        <img src="AOS_logo.jpg" class="logo-center">

        <p>Sistem absensi digital modern & profesional.</p><br>
        <button onclick="location.href='absensi.html'">Masuk ke Absensi</button>
    </div>
</section>

<!-- DASHBOARD -->
<section class="section" id="dashboard">
    <div class="card">
        <h2>📊 Dashboard Absensi</h2><br>
        <label>Filter Bulan:</label>
        <input type="month" id="filterBulan" onchange="loadDashboard()">
        <br><br>
        <canvas id="chart"></canvas>
    </div>
</section>

<!-- DATA SISWA -->
<section class="section" id="siswa">
    <div class="card">
        <h2>👥 Data Siswa</h2><br>
        <table>
            <thead>
                <tr><th>NIS</th><th>Nama</th><th>Aksi</th></tr>
            </thead>
            <tbody id="listSiswa"></tbody>
        </table>
    </div>
</section>

<!-- MODAL PREVIEW -->
<div class="modal" id="modal">
    <div class="modal-box">
        <h3 id="mNama"></h3>
        <p>Hadir: <b id="mHadir"></b></p>
        <p>Izin: <b id="mIzin"></b></p>
        <p>Sakit: <b id="mSakit"></b></p>
        <p>Alpha: <b id="mAlpha"></b></p><br>
        <button onclick="modal.classList.remove('active')">Tutup</button>
    </div>
</div>

<script>
window.onload=()=>setTimeout(()=>loadingAOS.remove(),1000)

/* NAV */
hamburger.onclick=()=>{
    hamburger.classList.toggle("active")
    sidebar.classList.toggle("active")
    overlay.classList.toggle("active")
}
overlay.onclick=()=>{hamburger.click()}
document.querySelectorAll("[data-section]").forEach(l=>{
    l.onclick=e=>{
        e.preventDefault()
        document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"))
        document.getElementById(l.dataset.section).classList.add("active")
        hamburger.click()
    }
})

/* DATA SISWA */
const siswa=[
{nis:"01",nama:"Afgan Aditya Syahreza"},
{nis:"02",nama:"Andin Amelian"},
{nis:"03",nama:"Anindya Novika"},
{nis:"04",nama:"Aryasatya Toru Mustofa"},
{nis:"05",nama:"Asyla Nayla Diah Susanto"},
{nis:"06",nama:"Audy Melinda Putri"},
{nis:"07",nama:"Aurelia Zera Indri Calista"},
{nis:"08",nama:"Avansya Syaputra Pratama"},
{nis:"09",nama:"Dava Alreza Saputra"},
{nis:"010",nama:"Dhiva Gina Rosita"},
{nis:"011",nama:"Dienda Rafita Cahaya"},
{nis:"012",nama:"Friska Aprilliana"},
{nis:"013",nama:"Icha Ajeng Sevtiana"},
{nis:"014",nama:"Jazila Rahma Mufidah"},
{nis:"015",nama:"Mei Wulansari"},
{nis:"016",nama:"Melati Putri Zahratusita"},
{nis:"017",nama:"Moh Ardiansyah Tri"},
{nis:"018",nama:"Moh Maulana Ridlo"},
{nis:"019",nama:"Mutiara Citra Widiasari"},
{nis:"020",nama:"Naufal Agastian Wiyanata"}
]

const absensi=JSON.parse(localStorage.getItem("dataAbsensi"))||[]

listSiswa.innerHTML=siswa.map(s=>`
<tr>
<td>${s.nis}</td>
<td>${s.nama}</td>
<td><button onclick="preview('${s.nama}')">Preview</button></td>
</tr>`).join("")

function preview(nama){
    const d=absensi.filter(a=>a.nama===nama)
    mNama.innerText=nama
    mHadir.innerText=d.filter(x=>x.status=="Hadir").length
    mIzin.innerText=d.filter(x=>x.status=="Izin").length
    mSakit.innerText=d.filter(x=>x.status=="Sakit").length
    mAlpha.innerText=d.filter(x=>x.status=="Alpha").length
    modal.classList.add("active")
}

/* DASHBOARD */
function loadDashboard(){
    new Chart(chart,{
        type:"doughnut",
        data:{
            labels:["Hadir","Izin","Sakit","Alpha"],
            datasets:[{data:[
                absensi.filter(a=>a.status=="Hadir").length,
                absensi.filter(a=>a.status=="Izin").length,
                absensi.filter(a=>a.status=="Sakit").length,
                absensi.filter(a=>a.status=="Alpha").length
            ]}]
        }
    })
}
loadDashboard()
</script>

</body>
</html>
