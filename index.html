<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AOS | Absensi Online Siswa</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Poppins',sans-serif;
    background:#f4f7fb;
    color:#1a2b5f;
}

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 32px;
    background:#fff;
    box-shadow:0 4px 12px rgba(0,0,0,.06);
}
.evscientist{
    font-weight:800;
    letter-spacing:3px;
}

/* HAMBURGER */
.hamburger{
    width:32px;height:24px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    cursor:pointer;
}
.hamburger span{
    height:4px;
    background:#346dff;
    border-radius:2px;
}

/* SIDEBAR */
.sidebar{
    position:fixed;
    right:-260px;top:0;
    width:260px;height:100%;
    background:#346dff;
    padding:90px 25px;
    transition:.3s;
    z-index:10;
}
.sidebar.active{right:0}
.sidebar a{
    display:block;
    color:#fff;
    text-decoration:none;
    margin-bottom:18px;
    font-size:1.05rem;
}
.overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.4);
    display:none;
}
.overlay.active{display:block}

/* SECTION */
.section{display:none;padding:40px 20px}
.section.active{display:block}

/* CARD */
.card{
    max-width:1100px;
    margin:auto;
    background:#fff;
    border-radius:18px;
    padding:40px;
    box-shadow:0 18px 40px rgba(0,0,0,.08);
}

/* LOGO */
.logo-center{
    display:flex;
    justify-content:center;
    margin-bottom:20px;
}
.logo-center img{
    width:90px;
}

/* BUTTON */
button{
    background:#346dff;
    color:#fff;
    border:none;
    padding:14px 30px;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
}

/* DASHBOARD BACKGROUND */
#dashboard{
    background:linear-gradient(135deg,#e6efff,#f4f7ff);
}

/* STATS */
.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:20px;
    margin:25px 0;
}
.stat{
    padding:24px;
    border-radius:16px;
    color:#fff;
    text-align:center;
}
.hadir{background:#22c55e}
.izin{background:#3b82f6}
.sakit{background:#facc15}
.alpha{background:#ef4444}

/* SISWA LIST */
.student-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:18px;
    margin-top:30px;
}
.student{
    background:#fff;
    padding:18px;
    border-radius:14px;
    box-shadow:0 8px 18px rgba(0,0,0,.08);
}
.student button{
    margin-top:10px;
    width:100%;
}

/* MODAL */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:none;
    justify-content:center;
    align-items:center;
}
.modal.active{display:flex}
.modal-content{
    background:#fff;
    padding:30px;
    border-radius:16px;
    width:90%;
    max-width:420px;
}
</style>
</head>

<body>

<header>
    <div class="evscientist">EVSCIENTIST FIVE</div>
    <div class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
    </div>
</header>

<div class="sidebar" id="sidebar">
    <a href="#" data-section="home">Home</a>
    <a href="#" data-section="dashboard">Dashboard</a>
</div>
<div class="overlay" id="overlay"></div>

<!-- HOME -->
<section class="section active" id="home">
    <div class="card">
        <div class="logo-center">
            <img src="AOS_logo.jpg">
        </div>

        <h1 style="text-align:center">AOS — Absensi Online Siswa</h1>
        <p style="text-align:center;margin:10px 0 25px">
            Sistem absensi digital modern
        </p>

        <div style="text-align:center">
            <button onclick="location.href='absensi.html'">
                Masuk ke Absensi
            </button>
        </div>
    </div>
</section>

<!-- DASHBOARD -->
<section class="section" id="dashboard">
    <div class="card">

        <h1>Dashboard Absensi</h1>

        <select id="bulan" onchange="renderData()" style="margin:15px 0;padding:8px">
            <option value="">Semua Bulan</option>
        </select>

        <div class="stats">
            <div class="stat hadir"><h3 id="hadir">0</h3>Hadir</div>
            <div class="stat izin"><h3 id="izin">0</h3>Izin</div>
            <div class="stat sakit"><h3 id="sakit">0</h3>Sakit</div>
            <div class="stat alpha"><h3 id="alpha">0</h3>Alpha</div>
        </div>

        <canvas id="chart"></canvas>

        <h2 style="margin-top:40px">Daftar Siswa</h2>
        <div class="student-list" id="students"></div>
    </div>
</section>

<!-- MODAL -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h3 id="modalNama"></h3>
        <p>Hadir: <span id="mHadir"></span></p>
        <p>Izin: <span id="mIzin"></span></p>
        <p>Sakit: <span id="mSakit"></span></p>
        <p>Alpha: <span id="mAlpha"></span></p>
        <br>
        <button onclick="modal.classList.remove('active')">Tutup</button>
    </div>
</div>

<script>
const siswa=[
{nis:"01",nama:"Afgan Aditya Syahreza"},
{nis:"02",nama:"Andin Amelian"},
{nis:"03",nama:"Anindya Novika"},
{nis:"04",nama:"Aryasatya Toru Mustofa"},
{nis:"05",nama:"Asyla Nayla Diah Susanto"},
{nis:"06",nama:"Audy Melinda Putri"},
{nis:"07",nama:"Aurelia Zera Indri Calista"},
{nis:"08",nama:"Avansya Syaputra Pratama"},
{nis:"09",nama:"Dava Alreza Saputra"},
{nis:"010",nama:"Dhiva Gina Rosita"},
{nis:"011",nama:"Dienda Rafita Cahaya"},
{nis:"012",nama:"Friska Aprilliana"},
{nis:"013",nama:"Icha Ajeng Sevtiana"},
{nis:"014",nama:"Jazila Rahma Mufidah"},
{nis:"015",nama:"Mei Wulansari"},
{nis:"016",nama:"Melati Putri Zahratusita"},
{nis:"017",nama:"Moh Ardiansyah Tri"},
{nis:"018",nama:"Moh Maulana Ridlo"},
{nis:"019",nama:"Mutiara Citra Widiasari"},
{nis:"020",nama:"Naufal Agastian Wiyanata"}
];

const dataAbsensi=JSON.parse(localStorage.getItem("dataAbsensi"))||[];
const students=document.getElementById("students");
const modal=document.getElementById("modal");

siswa.forEach(s=>{
    const d=document.createElement("div");
    d.className="student";
    d.innerHTML=`<b>${s.nama}</b><br>NIS ${s.nis}
    <button onclick="preview('${s.nis}','${s.nama}')">Preview</button>`;
    students.appendChild(d);
});

function preview(nis,nama){
    const d=dataAbsensi.filter(x=>x.nis===nis);
    modalNama.innerText=nama;
    mHadir.innerText=d.filter(x=>x.status==="Hadir").length;
    mIzin.innerText=d.filter(x=>x.status==="Izin").length;
    mSakit.innerText=d.filter(x=>x.status==="Sakit").length;
    mAlpha.innerText=d.filter(x=>x.status==="Alpha").length;
    modal.classList.add("active");
}

/* NAV */
hamburger.onclick=()=>{
    sidebar.classList.toggle("active");
    overlay.classList.toggle("active");
};
overlay.onclick=()=>{
    sidebar.classList.remove("active");
    overlay.classList.remove("active");
};
document.querySelectorAll("[data-section]").forEach(l=>{
    l.onclick=e=>{
        e.preventDefault();
        document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
        document.getElementById(l.dataset.section).classList.add("active");
        sidebar.classList.remove("active");
        overlay.classList.remove("active");
    };
});
</script>

</body>
</html>
