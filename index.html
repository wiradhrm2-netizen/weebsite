<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AOS | Absensi Online Siswa</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#0f1c3f,#1e3a8a,#2563eb);
    color:#1e293b;
    min-height:100vh;
}

/* ===== LOADING ===== */
#loadingAOS{
    position:fixed;inset:0;
    background:#0f172a;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    color:#fff;
}
.loader-circle{
    width:70px;height:70px;
    border:6px solid #93c5fd;
    border-top:6px solid #2563eb;
    border-radius:50%;
    animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== HEADER ===== */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 32px;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(12px);
}
.evscientist{
    font-size:1.3rem;
    font-weight:900;
    letter-spacing:3px;
    color:#2563eb;
}

/* ===== HAMBURGER ===== */
.hamburger{
    width:34px;height:26px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    cursor:pointer;
}
.hamburger span{
    height:4px;
    background:#2563eb;
    border-radius:2px;
    transition:.3s;
}
.hamburger.active span:nth-child(1){transform:rotate(45deg) translate(6px,6px)}
.hamburger.active span:nth-child(2){opacity:0}
.hamburger.active span:nth-child(3){transform:rotate(-45deg) translate(6px,-6px)}

/* ===== SIDEBAR ===== */
.sidebar{
    position:fixed;
    right:-280px;top:0;
    width:280px;height:100%;
    background:linear-gradient(180deg,#1e40af,#2563eb);
    padding:90px 25px;
    transition:.3s;
    z-index:1000;
}
.sidebar.active{right:0}
.sidebar a{
    display:block;
    color:#fff;
    text-decoration:none;
    margin-bottom:18px;
    font-size:1.05rem;
}

/* ===== OVERLAY ===== */
.overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.4);
    opacity:0;visibility:hidden;
    transition:.3s;
}
.overlay.active{opacity:1;visibility:visible}

/* ===== SECTION ===== */
.section{display:none;padding:40px 20px}
.section.active{display:block}

/* ===== CARD ===== */
.card{
    max-width:1100px;
    margin:auto;
    background:#ffffff;
    border-radius:18px;
    padding:35px;
    box-shadow:0 20px 45px rgba(0,0,0,.15);
}

/* ===== BUTTON ===== */
button{
    background:#2563eb;
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}
button.outline{
    background:#e5edff;
    color:#1e40af;
}

/* ===== TABLE ===== */
table{width:100%;border-collapse:collapse}
th{
    background:#2563eb;
    color:#fff;
    padding:12px;
}
td{
    padding:10px;
    text-align:center;
}
tr:nth-child(even){background:#f1f5ff}

/* ===== DASHBOARD ===== */
.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:20px;
    margin:25px 0;
}
.stat{
    padding:22px;
    border-radius:14px;
    color:#fff;
    text-align:center;
}
.hadir{background:#22c55e}
.izin{background:#3b82f6}
.sakit{background:#facc15;color:#000}
.alpha{background:#ef4444}

/* ===== MODAL ===== */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:2000;
}
.modal.active{display:flex}
.modal-box{
    background:#fff;
    padding:30px;
    border-radius:16px;
    width:90%;
    max-width:500px;
}
</style>
</head>

<body>

<div id="loadingAOS">
    <div class="loader-circle"></div>
    <p>Loading AOS...</p>
</div>

<header>
    <div class="evscientist">EVSCIENTIST FIVE</div>
    <div class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
    </div>
</header>

<div class="sidebar" id="sidebar">
    <a href="#" data-section="home">🏠 Home</a>
    <a href="#" data-section="dashboard">📊 Dashboard</a>
    <a href="#" data-section="siswa">📋 Data Siswa</a>
</div>
<div class="overlay" id="overlay"></div>

<!-- HOME -->
<section class="section active" id="home">
    <div class="card">
        <h1>AOS — Absensi Online Siswa</h1>
        <p>Sistem absensi modern berbasis web</p>
    </div>
</section>

<!-- DASHBOARD -->
<section class="section" id="dashboard">
    <div class="card">
        <h2>Dashboard Absensi</h2>

        <label>Filter Bulan:
            <input type="month" id="filterBulan">
        </label>

        <div class="stats">
            <div class="stat hadir"><h3 id="hadir">0</h3>Hadir</div>
            <div class="stat izin"><h3 id="izin">0</h3>Izin</div>
            <div class="stat sakit"><h3 id="sakit">0</h3>Sakit</div>
            <div class="stat alpha"><h3 id="alpha">0</h3>Alpha</div>
        </div>

        <canvas id="chart"></canvas>
    </div>
</section>

<!-- DATA SISWA -->
<section class="section" id="siswa">
    <div class="card">
        <h2>Daftar Siswa</h2>
        <table>
            <thead>
                <tr>
                    <th>NIS</th><th>Nama</th><th>Aksi</th>
                </tr>
            </thead>
            <tbody id="listSiswa"></tbody>
        </table>
    </div>
</section>

<!-- MODAL PREVIEW -->
<div class="modal" id="modal">
    <div class="modal-box">
        <h3 id="modalNama"></h3>
        <p>Hadir: <b id="mHadir"></b></p>
        <p>Izin: <b id="mIzin"></b></p>
        <p>Sakit: <b id="mSakit"></b></p>
        <p>Alpha: <b id="mAlpha"></b></p>
        <br>
        <button onclick="closeModal()">Tutup</button>
    </div>
</div>

<script>
window.onload=()=>setTimeout(()=>loadingAOS.remove(),800)

/* NAV */
hamburger.onclick=()=>{
    hamburger.classList.toggle("active")
    sidebar.classList.toggle("active")
    overlay.classList.toggle("active")
}
overlay.onclick=()=>{hamburger.click()}

document.querySelectorAll("[data-section]").forEach(l=>{
    l.onclick=e=>{
        e.preventDefault()
        document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"))
        document.getElementById(l.dataset.section).classList.add("active")
        hamburger.click()
    }
})

/* DATA SISWA */
const siswa=[
{nis:"01",nama:"Afgan Aditya Syahreza"},
{nis:"02",nama:"Andin Amelian"},
{nis:"03",nama:"Anindya Novika"},
{nis:"04",nama:"Aryasatya Toru Mustofa"},
{nis:"05",nama:"Asyla Nayla Diah Susanto"},
{nis:"06",nama:"Audy Melinda Putri"},
{nis:"07",nama:"Aurelia Zera Indri Calista"},
{nis:"08",nama:"Avansya Syaputra Pratama"},
{nis:"09",nama:"Dava Alreza Saputra"},
{nis:"010",nama:"Dhiva Gina Rosita"},
{nis:"011",nama:"Dienda Rafita Cahaya"},
{nis:"012",nama:"Friska Aprilliana"},
{nis:"013",nama:"Icha Ajeng Sevtiana"},
{nis:"014",nama:"Jazila Rahma Mufidah"},
{nis:"015",nama:"Mei Wulansari"},
{nis:"016",nama:"Melati Putri Zahratusita"},
{nis:"017",nama:"Moh Ardiansyah Tri"},
{nis:"018",nama:"Moh Maulana Ridlo"},
{nis:"019",nama:"Mutiara Citra Widiasari"},
{nis:"020",nama:"Naufal Agastian Wiyanata"}
]

const dataAbsensi=JSON.parse(localStorage.getItem("dataAbsensi"))||[]

listSiswa.innerHTML=siswa.map(s=>`
<tr>
<td>${s.nis}</td>
<td>${s.nama}</td>
<td>
<button class="outline" onclick="preview('${s.nama}')">Preview</button>
</td>
</tr>
`).join("")

function preview(nama){
    const d=dataAbsensi.filter(x=>x.nama===nama)
    mHadir.innerText=d.filter(x=>x.status=="Hadir").length
    mIzin.innerText=d.filter(x=>x.status=="Izin").length
    mSakit.innerText=d.filter(x=>x.status=="Sakit").length
    mAlpha.innerText=d.filter(x=>x.status=="Alpha").length
    modalNama.innerText=nama
    modal.classList.add("active")
}
function closeModal(){modal.classList.remove("active")}
</script>

</body>
</html>
