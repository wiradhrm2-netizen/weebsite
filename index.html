<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AOS | Absensi Online Siswa</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#eef5ff,#dbeafe);
    color:#1e3a8a;
    min-height:100vh;
}

/* LOADING */
#loadingAOS{
    position:fixed;inset:0;
    background:#fff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
}
.loader-circle{
    width:60px;height:60px;
    border:6px solid #dbeafe;
    border-top:6px solid #3b82f6;
    border-radius:50%;
    animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* HEADER */
header{
    display:grid;
    grid-template-columns:40px 1fr 40px;
    align-items:center;
    padding:16px 24px;
    background:rgba(255,255,255,.8);
    backdrop-filter:blur(10px);
    box-shadow:0 8px 20px rgba(0,0,0,.06);
}
header img{
    grid-column:2;
    margin:auto;
    height:42px;
}

/* HAMBURGER */
.hamburger{
    width:32px;height:24px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    cursor:pointer;
}
.hamburger span{
    height:4px;
    background:#3b82f6;
    border-radius:2px;
    transition:.3s;
}
.hamburger.active span:nth-child(1){transform:rotate(45deg) translate(6px,6px)}
.hamburger.active span:nth-child(2){opacity:0}
.hamburger.active span:nth-child(3){transform:rotate(-45deg) translate(6px,-6px)}

/* SIDEBAR */
.sidebar{
    position:fixed;
    right:-260px;top:0;
    width:260px;height:100%;
    background:#3b82f6;
    padding:90px 24px;
    transition:.3s;
    z-index:1000;
}
.sidebar.active{right:0}
.sidebar a{
    display:block;
    color:#fff;
    text-decoration:none;
    margin-bottom:18px;
    font-size:1.05rem;
}

/* OVERLAY */
.overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.4);
    opacity:0;visibility:hidden;
}
.overlay.active{opacity:1;visibility:visible}

/* SECTION */
.section{display:none;padding:32px 16px}
.section.active{display:block}

/* CARD */
.card{
    max-width:1100px;
    margin:auto;
    background:#fff;
    border-radius:20px;
    padding:32px;
    box-shadow:0 20px 40px rgba(0,0,0,.08);
}

/* BUTTON */
button{
    background:#3b82f6;
    color:#fff;
    border:none;
    padding:12px 28px;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
}

/* TABLE */
table{width:100%;border-collapse:collapse;margin-top:20px}
th{
    background:#3b82f6;
    color:#fff;
    padding:12px;
}
td{
    padding:10px;
    text-align:center;
}
tr:nth-child(even){background:#f1f5ff}

/* STATS */
.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:16px;
    margin:24px 0;
}
.stat{
    padding:22px;
    border-radius:16px;
    color:#fff;
    text-align:center;
}
.hadir{background:#22c55e}
.izin{background:#3b82f6}
.sakit{background:#facc15}
.alpha{background:#ef4444}

/* MODAL */
.modal{
    position:fixed;inset:0;
    background:rgba(0,0,0,.4);
    display:none;
    justify-content:center;
    align-items:center;
}
.modal.active{display:flex}
.modal-content{
    background:#fff;
    padding:28px;
    border-radius:18px;
    max-width:400px;
    width:90%;
}
</style>
</head>

<body>

<div id="loadingAOS">
    <div class="loader-circle"></div>
</div>

<header>
    <div class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
    </div>
    <img src="AOS_logo.jpg" alt="AOS Logo">
</header>

<div class="sidebar" id="sidebar">
    <a href="#" data-section="home">🏠 Home</a>
    <a href="#" data-section="dashboard">📊 Dashboard</a>
    <a href="#" data-section="siswa">👥 Data Siswa</a>
</div>
<div class="overlay" id="overlay"></div>

<section class="section active" id="home">
<div class="card">
<h1>AOS — Absensi Online Siswa</h1>
<p>Sistem absensi digital modern.</p><br>
<button onclick="location.href='absensi.html'">Masuk ke Absensi</button>
</div>
</section>

<section class="section" id="dashboard">
<div class="card">
<h2>Dashboard Absensi</h2>

<select id="bulanFilter">
<option value="">Semua Bulan</option>
<option value="0">Januari</option>
<option value="1">Februari</option>
<option value="2">Maret</option>
</select>

<div class="stats">
<div class="stat hadir"><h3 id="hadir">0</h3>Hadir</div>
<div class="stat izin"><h3 id="izin">0</h3>Izin</div>
<div class="stat sakit"><h3 id="sakit">0</h3>Sakit</div>
<div class="stat alpha"><h3 id="alpha">0</h3>Alpha</div>
</div>

<canvas id="chart"></canvas>
</div>
</section>

<section class="section" id="siswa">
<div class="card">
<h2>Daftar Siswa</h2>
<table>
<thead>
<tr><th>NIS</th><th>Nama</th><th>Aksi</th></tr>
</thead>
<tbody id="siswaList"></tbody>
</table>
</div>
</section>

<div class="modal" id="modal">
<div class="modal-content">
<h3 id="modalNama"></h3>
<p>Hadir: <b id="mHadir"></b></p>
<p>Izin: <b id="mIzin"></b></p>
<p>Sakit: <b id="mSakit"></b></p>
<p>Alpha: <b id="mAlpha"></b></p><br>
<button onclick="modal.classList.remove('active')">Tutup</button>
</div>
</div>

<script>
window.onload=()=>setTimeout(()=>loadingAOS.remove(),800)

hamburger.onclick=()=>toggle()
overlay.onclick=()=>toggle(false)
function toggle(force){
hamburger.classList.toggle("active",force)
sidebar.classList.toggle("active",force)
overlay.classList.toggle("active",force)
}
document.querySelectorAll("[data-section]").forEach(l=>{
l.onclick=e=>{
e.preventDefault()
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"))
document.getElementById(l.dataset.section).classList.add("active")
toggle(false)
}
})

const siswa=[
{nis:"01",nama:"Afgan Aditya Syahreza"},
{nis:"02",nama:"Andin Amelian"},
{nis:"03",nama:"Anindya Novika"},
{nis:"04",nama:"Aryasatya Toru Mustofa"},
{nis:"05",nama:"Asyla Nayla Diah Susanto"},
{nis:"06",nama:"Audy Melinda Putri"},
{nis:"07",nama:"Aurelia Zera Indri Calista"},
{nis:"08",nama:"Avansya Syaputra Pratama"},
{nis:"09",nama:"Dava Alreza Saputra"},
{nis:"010",nama:"Dhiva Gina Rosita"},
{nis:"011",nama:"Dienda Rafita Cahaya"},
{nis:"012",nama:"Friska Aprilliana"},
{nis:"013",nama:"Icha Ajeng Sevtiana"},
{nis:"014",nama:"Jazila Rahma Mufidah"},
{nis:"015",nama:"Mei Wulansari"},
{nis:"016",nama:"Melati Putri Zahratusita"},
{nis:"017",nama:"Moh Ardiansyah Tri"},
{nis:"018",nama:"Moh Maulana Ridlo"},
{nis:"019",nama:"Mutiara Citra Widiasari"},
{nis:"020",nama:"Naufal Agastian Wiyanata"}
]

const list=document.getElementById("siswaList")
siswa.forEach(s=>{
list.innerHTML+=`
<tr>
<td>${s.nis}</td>
<td>${s.nama}</td>
<td>
<button onclick="preview('${s.nama}')">Preview</button>
</td>
</tr>`
})

function preview(nama){
const data=JSON.parse(localStorage.getItem("dataAbsensi"))||[]
const f=data.filter(d=>d.nama===nama)
mHadir.innerText=f.filter(d=>d.status==="Hadir").length
mIzin.innerText=f.filter(d=>d.status==="Izin").length
mSakit.innerText=f.filter(d=>d.status==="Sakit").length
mAlpha.innerText=f.filter(d=>d.status==="Alpha").length
modalNama.innerText=nama
modal.classList.add("active")
}
</script>

</body>
</html>
