<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Absensi Siswa</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body { font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#f5f7ff,#e0ebff);display:flex;justify-content:center;padding:30px;}
.card {background:#fff;padding:30px 40px;border-radius:20px;box-shadow:0 15px 40px rgba(0,0,0,0.1);width:100%;max-width:500px;}
input,select,button {width:100%;margin:10px 0;padding:12px;border-radius:10px;border:1px solid #ccc;font-size:15px;}
button {cursor:pointer;font-weight:600;}
#kirimManual {background:#346dff;color:#fff;}
.success {display:none;position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#4caf50;color:#fff;padding:15px 30px;border-radius:10px;}
.notif {position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:red;color:#fff;padding:14px 22px;border-radius:14px;opacity:0;transition:.3s;}
.notif.show {opacity:1;}
</style>
</head>

<body>
<div class="card">
<h1>Absensi Siswa</h1>

<h2>Scan QR</h2>
<div id="reader"></div>
<p id="scanStatus">Mengaktifkan kamera...</p>

<h2>Isi Manual</h2>
<input id="manualId" placeholder="NIS">
<input id="manualNama" placeholder="Nama Lengkap">
<input id="manualKelas" placeholder="No Absen">
<select id="manualStatus">
<option>Hadir</option>
<option>Izin</option>
<option>Sakit</option>
</select>
<input id="manualKet" placeholder="Keterangan">

<button id="kirimManual">Kirim Absen</button>
</div>

<div id="successMsg" class="success">✅ Absensi Berhasil</div>
<div id="notif" class="notif"></div>

<script>
/* ================= DATA SISWA ================= */
const DATA_SISWA = [
  {nis:"01",nama:"Afgan Aditya Syahreza"},
  {nis:"02",nama:"Andin Amelian"},
  {nis:"03",nama:"Anindya Novika"},
  {nis:"04",nama:"Aryasatya Toru Mustofa"},
  {nis:"05",nama:"Asyla Nayla Diah Susanto"},
  {nis:"06",nama:"Audy Melinda Putri"},
  {nis:"07",nama:"Aurelia Zera Indri Calista"},
  {nis:"08",nama:"Avansya Syaputra Pratama"},
  {nis:"09",nama:"Dava Alreza Saputra"},
  {nis:"010",nama:"Dhiva Gina Rosita"},
  {nis:"011",nama:"Dienda Rafita Cahaya"},
  {nis:"012",nama:"Friska Aprilliana"},
  {nis:"013",nama:"Icha Ajeng Sevtiana"},
  {nis:"014",nama:"Jazila Rahma Mufidah"},
  {nis:"015",nama:"Mei Wulansari"},
  {nis:"016",nama:"Melati Putri Zahratusita"},
  {nis:"017",nama:"Moh Ardiansyah Tri"},
  {nis:"018",nama:"Moh Maulana Ridlo"},
  {nis:"019",nama:"Mutiara Citra Widiasari"},
  {nis:"020",nama:"Naufal Agastian Wiyanata"}
];

let sudahAbsen=false;
let logAbsen=JSON.parse(localStorage.getItem("logAbsen")||"{}");

/* ================= UTIL ================= */
function showNotif(msg){
  const n=document.getElementById("notif");
  n.innerText=msg;
  n.classList.add("show");
  setTimeout(()=>n.classList.remove("show"),2000);
}

function showSuccess(){
  const s=document.getElementById("successMsg");
  s.style.display="block";
  setTimeout(()=>s.style.display="none",2000);
}

function validSiswa(nis,nama){
  return DATA_SISWA.find(
    s=>s.nis===nis && s.nama.toLowerCase()===nama.toLowerCase()
  );
}

/* ================= WA ================= */
function kirimWA(nama,no_absen,nis,status,ket){
  let pesan=`ABSENSI SISWA
Nama: ${nama}
NIS: ${nis}
No Absen: ${no_absen}
Status: ${status}
Keterangan: ${ket||"-"}
Tanggal: ${new Date().toLocaleDateString()}`;

  window.open(
    "https://wa.me/6285604757431?text="+encodeURIComponent(pesan),
    "_blank"
  );
}

/* ================= QR ================= */
const reader=new Html5Qrcode("reader");
Html5Qrcode.getCameras().then(cams=>{
  if(cams.length){
    reader.start(cams[0].id,{fps:10,qrbox:250},qr=>{
      const p=qr.split("|");
      if(p.length<3){showNotif("QR tidak valid");return;}
      manualId.value=p[0];
      manualNama.value=p[1];
      manualKelas.value=p[2];
    });
  }
});

/* ================= SUBMIT ================= */
kirimManual.onclick=()=>{
  if(sudahAbsen) return;

  const nis=manualId.value.trim();
  const nama=manualNama.value.trim();
  const no_absen=manualKelas.value.trim();
  const status=manualStatus.value;
  const ket=manualKet.value.trim();

  if(!nis||!nama||!no_absen){
    showNotif("Form belum lengkap");
    return;
  }

  const valid=validSiswa(nis,nama);
  if(!valid){
    showNotif("❌ ABSENSI SALAH");
    return; // ⛔ STOP — TIDAK KE WA
  }

  if(logAbsen[nis]){
    showNotif("⚠️ SUDAH ABSEN");
    return;
  }

  logAbsen[nis]=true;
  localStorage.setItem("logAbsen",JSON.stringify(logAbsen));

  sudahAbsen=true;
  showSuccess();
  kirimWA(nama,no_absen,nis,status,ket);
};
</script>
</body>
</html>
